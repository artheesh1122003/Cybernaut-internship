<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Spam Sentinel Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
            color: #fff;
        }

        /* Ambient Orbs */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.6;
        }

        .orb-1 {
            top: -100px;
            left: -100px;
            width: 600px;
            height: 600px;
            background: #FF416C;
            animation: float 20s ease-in-out infinite alternate;
        }

        .orb-2 {
            bottom: -150px;
            right: -50px;
            width: 700px;
            height: 700px;
            background: #8E2DE2;
            animation: float-rev 18s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(100px, 100px) scale(1.1);
            }
        }

        @keyframes float-rev {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(-100px, -100px) scale(1.2);
            }
        }

        /* Main Container */
        .dashboard-container {
            width: 100%;
            max-width: 1300px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Bar: Stats */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-info h4 {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-info .value {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .icon-total {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
        }

        .icon-spam {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .icon-ham {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }

        /* Dashboard Split */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 950px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                grid-template-columns: 1fr;
            }
        }

        /* Glass Panel Reusable */
        .glass-panel {
            background: rgba(10, 15, 20, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1.1rem;
            resize: none;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.5);
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        button {
            padding: 15px 30px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        button.primary {
            background: linear-gradient(135deg, #FF416C 0%, #FF4B2B 100%);
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
            flex: 1;
        }

        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.5);
        }

        /* Results Area */
        .result-box {
            margin-top: 30px;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            display: none;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-box.spam {
            border-color: #ff4b2b;
        }

        .result-box.ham {
            border-color: #2ecc71;
        }

        .res-title {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .res-main {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 5px 0;
        }

        .spam .res-main {
            color: #ff4b2b;
        }

        .ham .res-main {
            color: #2ecc71;
        }

        /* Explainable AI Highlight */
        .explain-box {
            margin-top: 20px;
            text-align: left;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
            border-left: 4px solid #ff4b2b;
            display: none;
        }

        .explain-box h4 {
            margin-bottom: 10px;
            font-weight: 500;
            color: #ff4b2b;
        }

        .bad-word {
            background: rgba(255, 75, 43, 0.3);
            border: 1px solid rgba(255, 75, 43, 0.6);
            border-radius: 4px;
            padding: 1px 4px;
            font-weight: 600;
        }

        /* Sidebar History */
        .history-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-list::-webkit-scrollbar {
            width: 5px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        .hist-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hist-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tag {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .tag.spam {
            background: rgba(255, 75, 43, 0.2);
            color: #ff4b2b;
            border: 1px solid rgba(255, 75, 43, 0.4);
        }

        .tag.ham {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.4);
        }

        .time {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .snippet {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            line-height: 1.3;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="dashboard-container">

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-info">
                    <h4>Total Processed</h4>
                    <div class="value" id="statTotal">0</div>
                </div>
                <div class="stat-icon icon-total">∞</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h4>Threats Blocked</h4>
                    <div class="value" id="statSpam">0</div>
                </div>
                <div class="stat-icon icon-spam">!</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h4>Safe Emails</h4>
                    <div class="value" id="statHam">0</div>
                </div>
                <div class="stat-icon icon-ham">✓</div>
            </div>
        </div>

        <!-- Grid Layout -->
        <div class="dashboard-grid">

            <!-- Analysis Chamber -->
            <div class="glass-panel" data-tilt data-tilt-max="1" data-tilt-speed="400">
                <div class="header">
                    <h1>Threat Analysis Chamber</h1>
                    <p>Powered by advanced NLP Vectorization & Support Vector Machines.</p>
                </div>

                <textarea id="emailInput" placeholder="Initialize scan... Paste raw email contents here..."></textarea>

                <div class="btn-group">
                    <button class="primary" onclick="analyzeTarget()" id="btnAnalyze"
                        style="display:flex; justify-content:center; align-items:center; gap: 10px;">
                        <span id="btnText">Initiate Scan</span>
                        <div class="loader" id="loader"></div>
                    </button>
                    <button onclick="document.getElementById('emailInput').value = ''; hideResults();">Reset</button>
                </div>

                <div class="result-box" id="resultBox">
                    <div class="res-title">Scan Result</div>
                    <div class="res-main" id="resPrediction">Awaiting</div>
                    <div style="color: rgba(255,255,255,0.7);" id="resConf">Confidence: -</div>
                </div>

                <div class="explain-box" id="explainBox">
                    <h4>AI Explainability</h4>
                    <p style="font-size: 0.9rem; margin-bottom: 8px; color: rgba(255,255,255,0.6);">
                        The model detected the following high-priority spam indicators:
                    </p>
                    <div id="explainContent"></div>
                </div>
            </div>

            <!-- Activity Log -->
            <div class="glass-panel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="font-weight: 500;">Live Feed</h3>
                    <button onclick="wipeFeed()" style="padding: 6px 12px; font-size: 0.8rem;">Wipe Log</button>
                </div>
                <div class="history-list" id="historyFeed">
                    <!-- Dynamic Items -->
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchStats();
            fetchHistory();
        });

        async function fetchStats() {
            try {
                let res = await fetch('/stats');
                let data = await res.json();
                document.getElementById('statTotal').innerText = data.total;
                document.getElementById('statSpam').innerText = data.spam;
                document.getElementById('statHam').innerText = data.ham;
            } catch (e) { console.error(e); }
        }

        async function fetchHistory() {
            try {
                let res = await fetch('/history');
                let data = await res.json();
                const feed = document.getElementById('historyFeed');
                if (data.length === 0) {
                    feed.innerHTML = '<div style="opacity:0.5; padding: 20px; text-align:center;">Feed empty.</div>';
                    return;
                }

                let html = '';
                data.forEach(item => {
                    const tagClass = item.color === 'error' ? 'spam' : 'ham';
                    html += `
                        <div class="hist-item">
                            <div class="hist-top">
                                <span class="tag ${tagClass}">${item.prediction} ${item.confidence ? '(' + item.confidence + '%)' : ''}</span>
                                <span class="time">${item.timestamp}</span>
                            </div>
                            <div class="snippet">"${item.text_snippet}"</div>
                        </div>
                    `;
                });
                feed.innerHTML = html;
            } catch (e) { console.error(e); }
        }

        async function wipeFeed() {
            if (!confirm("Erase all tracking data? This drops the SQLite table.")) return;
            await fetch('/clear', { method: 'POST' });
            fetchStats();
            fetchHistory();
        }

        function hideResults() {
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('explainBox').style.display = 'none';
        }

        async function analyzeTarget() {
            const text = document.getElementById('emailInput').value;
            if (!text.trim()) return alert("Provide input data.");

            const btn = document.getElementById('btnAnalyze');
            const loader = document.getElementById('loader');
            const btnText = document.getElementById('btnText');

            btn.disabled = true;
            btnText.style.display = 'none';
            loader.style.display = 'block';

            try {
                let res = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                let data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Server Fault');

                // Update Box
                const box = document.getElementById('resultBox');
                box.className = 'result-box ' + (data.color === 'error' ? 'spam' : 'ham');
                document.getElementById('resPrediction').innerText = data.prediction;
                document.getElementById('resConf').innerText = data.confidence ? 'Confidence Degree: ' + data.confidence + '%' : '';
                box.style.display = 'block';

                // Explainability Logic
                const expBox = document.getElementById('explainBox');
                const expContent = document.getElementById('explainContent');
                if (data.color === 'error' && data.highlights && data.highlights.length > 0) {
                    // Extract words
                    const spamWords = data.highlights.map(h => h.word.toLowerCase());

                    // Highlight occurrences in snippet text
                    let displaySnippet = text;
                    if (displaySnippet.length > 300) displaySnippet = displaySnippet.substring(0, 300) + '...';

                    // Escape HTML basic
                    displaySnippet = displaySnippet.replace(/</g, "&lt;").replace(/>/g, "&gt;");

                    // Apply highlighting
                    spamWords.forEach(sw => {
                        const regex = new RegExp("\\b(" + sw + ")\\b", "gi");
                        displaySnippet = displaySnippet.replace(regex, "<span class='bad-word'>$1</span>");
                    });

                    expContent.innerHTML = `
                        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px;">
                            ${displaySnippet}
                        </div>
                    `;
                    expBox.style.display = 'block';
                } else {
                    expBox.style.display = 'none';
                }

                // Refresh Side Data
                fetchStats();
                fetchHistory();

            } catch (e) {
                alert(e.message);
            } finally {
                btn.disabled = false;
                btnText.style.display = 'inline';
                loader.style.display = 'none';
            }
        }
    </script>
</body>

</html>
